<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News · Snopcministri</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v=53">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="app">
    <header class="top">
      <div class="brand">
        <p class="eyebrow">Yahoo Fantasy · NBA {{ league_id }}</p>
        <h1>News</h1>
        <p class="sub">NBA.com + CBS Sports fantasy news — saved and linked to matching players in your DB.</p>
        {% include "partials/nav.html" %}
      </div>
      <div class="actions">
        {% include "partials/header_tools.html" %}
      </div>
    </header>

    <div id="alert" class="alert" hidden></div>
    <div id="jobBar" class="job-bar" hidden>
      <div class="job-bar-head">
        <strong id="jobBarLabel">Job</strong>
        <div class="job-bar-head-meta">
          <button type="button" id="btnPauseResume" class="btn ghost tiny job-pause-resume" hidden data-mode="pause">Pause</button>
          <button type="button" id="btnCancelJob" class="btn ghost tiny job-cancel" hidden>Stop</button>
          <span id="jobBarMeta" class="job-bar-meta">—</span>
        </div>
      </div>
      <p id="jobBarText" class="job-bar-text">Starting…</p>
      <div class="job-bar-track" aria-hidden="true">
        <div class="job-bar-fill" id="jobBarFill"></div>
      </div>
      <p class="job-bar-hint">Keep Chrome debug open. Stop cancels the whole run.</p>
    </div>

    <main class="news-layout">
      <div class="news-toolbar">
        <p class="panel-sub" id="newsSub">Loading…</p>
        <div class="news-filters">
          <label class="show-limit" for="newsFilter">
            <span>Show</span>
            <select id="newsFilter" aria-label="Filter matched news">
              <option value="all" selected>All</option>
              <option value="matched">Matched to DB</option>
              <option value="unmatched">Unmatched</option>
            </select>
          </label>
          <fieldset class="news-source-filters" id="newsSourceFilters">
            <legend>Sources</legend>
            <label class="check-inline">
              <input type="checkbox" name="newsSource" value="NBA.com Fantasy News" checked>
              <span>NBA.com</span>
            </label>
            <label class="check-inline">
              <input type="checkbox" name="newsSource" value="CBS Sports" checked>
              <span>CBS Sports</span>
            </label>
          </fieldset>
          <button type="button" class="btn ghost tiny" id="btnSyncNews" title="Link unmatched news to players in your DB">
            <span class="btn-label">Sync to players</span>
            <span class="btn-spinner" hidden></span>
          </button>
          <button type="button" class="btn primary tiny" id="btnRefreshNews" title="Fetch NBA.com and CBS Sports (5 pages)">
            <span class="btn-label">Refresh</span>
            <span class="btn-spinner" hidden></span>
          </button>
        </div>
      </div>
      <div id="newsFeed" class="news-feed"></div>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/news.js') }}?v=21"></script>
</body>
</html>
