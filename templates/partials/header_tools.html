<button
  type="button"
  class="btn icon-btn"
  id="btnGlobalRefresh"
  title="Morning refresh"
  aria-label="Morning refresh"
  aria-haspopup="dialog"
>
  <svg class="icon-gear" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12a9 9 0 1 1-2.6-6.2"></path>
    <path d="M21 3v6h-6"></path>
  </svg>
</button>
<a
  class="btn icon-btn yahoo-btn"
  href="https://basketball.fantasysports.yahoo.com/nba/{{ league_id }}"
  target="_blank"
  rel="noopener"
  title="Open Yahoo"
  aria-label="Open Yahoo"
>
  <img
    class="icon-yahoo"
    src="https://s.yimg.com/cv/apiv2/sports/logo/app-icon-60x60.jpg"
    alt=""
    width="16"
    height="16"
    decoding="async"
  >
</a>
<button
  type="button"
  class="btn icon-btn {% if active == 'notes' %}active{% endif %}"
  id="btnOpenNotes"
  title="Notes"
  aria-label="Notes"
>
  <svg class="icon-gear" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 4h9a2 2 0 0 1 2 2v14l-3-2-3 2-3-2-3 2V6a2 2 0 0 1 2-2z"></path>
    <path d="M10 9h6M10 13h6"></path>
  </svg>
</button>
<a
  href="{{ url_for('settings_page') }}"
  class="btn icon-btn {% if active == 'settings' %}active{% endif %}"
  title="Settings"
  aria-label="Settings"
>
  <svg class="icon-gear" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
  </svg>
</a>

<div class="modal notes-modal" id="notesModal" hidden>
  <div class="modal-backdrop" data-close-notes></div>
  <div class="modal-dialog panel notes-dialog" role="dialog" aria-modal="true" aria-labelledby="notesTitle">
    <div class="panel-head">
      <div>
        <h2 id="notesTitle">Notes</h2>
        <p class="panel-sub">Notes with links to players, NBA teams, and fantasy opponents.</p>
      </div>
      <div class="actions">
        <button type="button" class="btn primary tiny" id="btnNewNote">New note</button>
        <button type="button" class="btn ghost" data-close-notes>Close</button>
      </div>
    </div>
    <div class="notes-layout">
      <aside class="notes-list-panel">
        <div id="notesList" class="notes-list"></div>
        <p class="muted" id="notesEmpty" hidden>No notes yet. Click New note.</p>
      </aside>
      <section class="notes-editor-panel" id="notesEditor" hidden>
        <label class="notes-field">
          <span>Title</span>
          <input type="text" id="noteTitle" placeholder="e.g. Trade target, Waiver…" maxlength="160">
        </label>
        <div class="notes-field">
          <span>Body</span>
          <div class="notes-body-wrap">
            <div class="notes-toolbar" role="toolbar" aria-label="Text formatting">
              <button type="button" class="notes-tool" data-cmd="bold" title="Bold"><strong>B</strong></button>
              <button type="button" class="notes-tool" data-cmd="italic" title="Italic"><em>I</em></button>
              <span class="notes-tool-sep" aria-hidden="true"></span>
              <button type="button" class="notes-tool" data-font-size="3" title="Small text">A−</button>
              <button type="button" class="notes-tool" data-font-size="4" title="Normal text">A</button>
              <button type="button" class="notes-tool" data-font-size="5" title="Large text">A+</button>
              <span class="notes-tool-sep" aria-hidden="true"></span>
              <button type="button" class="notes-tool" data-cmd="insertUnorderedList" title="Bullet list">• List</button>
              <button type="button" class="notes-tool" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
            </div>
            <div
              id="noteBody"
              class="notes-body-editor"
              contenteditable="true"
              role="textbox"
              aria-multiline="true"
              data-placeholder="Your notes…"
            ></div>
          </div>
        </div>
        <div class="notes-field">
          <span>Links</span>
          <div class="notes-link-add">
            <select id="noteLinkType" aria-label="Link type">
              <option value="player">Player</option>
              <option value="nba_team">NBA team</option>
              <option value="fantasy_team">Fantasy team</option>
            </select>
            <input type="text" id="noteLinkQuery" list="noteLinkSuggestions" placeholder="Search…" autocomplete="off">
            <datalist id="noteLinkSuggestions"></datalist>
            <button type="button" class="btn ghost tiny" id="btnAddNoteLink">Add</button>
          </div>
          <div id="noteLinks" class="notes-chips"></div>
        </div>
        <div class="notes-editor-actions">
          <button type="button" class="btn primary" id="btnSaveNote">Save</button>
          <button type="button" class="btn danger" id="btnDeleteNote">Delete</button>
          <span class="panel-sub" id="noteSaveMeta"></span>
        </div>
      </section>
      <section class="notes-editor-panel" id="notesEditorEmpty">
        <p class="muted">Select a note on the left or create a new one.</p>
      </section>
    </div>
  </div>
</div>
<div class="modal refresh-modal" id="globalRefreshModal" hidden>
  <div class="modal-backdrop" data-close-global-refresh></div>
  <div class="modal-dialog panel refresh-dialog" role="dialog" aria-modal="true" aria-labelledby="globalRefreshTitle">
    <div class="panel-head">
      <div>
        <h2 id="globalRefreshTitle">Morning refresh</h2>
        <p class="panel-sub">Pick what to pull from Yahoo. Needs Chrome debug open.</p>
      </div>
      <div class="actions">
        <button type="button" class="btn ghost" data-close-global-refresh>Close</button>
      </div>
    </div>
    <form id="globalRefreshForm" class="refresh-modal-form">
      <fieldset class="settings-steps refresh-modal-steps">
        <legend>Steps</legend>
        <label class="settings-check" for="grStepLeague">
          <input id="grStepLeague" data-gr-step="league" type="checkbox" checked>
          <span>League data</span>
        </label>
        <label class="settings-check" for="grStepRoster">
          <input id="grStepRoster" data-gr-step="roster" type="checkbox" checked>
          <span>My roster players</span>
        </label>
        <label class="settings-check" for="grStepNews">
          <input id="grStepNews" data-gr-step="news" type="checkbox" checked>
          <span>Fantasy news</span>
        </label>
        <label class="settings-check" for="grStepInjuries">
          <input id="grStepInjuries" data-gr-step="injuries" type="checkbox" checked>
          <span>Injury report</span>
        </label>
        <label class="settings-check" for="grStepTrends">
          <input id="grStepTrends" data-gr-step="trends" type="checkbox" checked>
          <span>Trends</span>
        </label>
        <label class="settings-check" for="grStepAvailable">
          <input id="grStepAvailable" data-gr-step="available" type="checkbox" checked>
          <span>Top available players</span>
        </label>
      </fieldset>
      <label class="settings-field" for="grAvailableCount">
        <span>Available players to check</span>
        <input id="grAvailableCount" type="number" min="1" max="500" step="1" value="100">
        <span class="settings-hint">Only used if “Top available players” is on.</span>
      </label>
      <label class="settings-check" for="grRemember">
        <input id="grRemember" type="checkbox">
        <span>Remember these choices in Settings</span>
      </label>
      <div class="refresh-modal-actions">
        <button type="button" class="btn ghost tiny" id="btnGrSelectAll">All</button>
        <button type="button" class="btn ghost tiny" id="btnGrSelectNone">None</button>
        <button type="submit" class="btn primary" id="btnStartGlobalRefresh">
          <span class="btn-label">Start refresh</span>
          <span class="btn-spinner" hidden></span>
        </button>
      </div>
    </form>
  </div>
</div>

<script src="{{ url_for('static', filename='js/notes.js') }}?v=5"></script>
<script src="{{ url_for('static', filename='js/global-refresh.js') }}?v=4"></script>
